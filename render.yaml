services:
  # -------------------------------------------------------------
  # Vynora Recruiter Demo Showcase (Vite React SPA Static Site)
  # 1-Click Zero-Dependency Deployment
  # -------------------------------------------------------------
  - type: web
    name: vynora-demo
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_MODE
        value: demo
